name: OpenReel - Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      # IMPORTANTE:
      # Não usar cache: gradle aqui.
      # O projeto Android ainda está dentro do ZIP neste momento.
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 4. LOCALIZAR E EXTRAIR OPENREEL V10
      # ============================================================
      - name: Find and Extract OpenReel V10
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "OPENREEL V10"
          echo "========================================"

          echo "ZIPs encontrados:"
          find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print

          echo ""

          # Primeiro procura exatamente pela V10 final corrigida.
          ZIP="$(find . -type f \
            -iname 'OpenReel-complete-project-v10-final-fixed.zip' \
            -not -path './.git/*' \
            | head -n 1)"

          # Caso não encontre, procura qualquer ZIP V10.
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f \
              -iname 'OpenReel-complete-project-v10*.zip' \
              -not -path './.git/*' \
              | head -n 1)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP V10 encontrado."
            exit 1
          fi

          echo "ZIP selecionado:"
          echo "$ZIP"

          # ========================================================
          # EXTRAIR
          # ========================================================

          rm -rf _flutter_project
          mkdir -p _flutter_project

          unzip -q "$ZIP" -d _flutter_project

          echo ""
          echo "ZIP extraído com sucesso."

          # ========================================================
          # LOCALIZAR PUBSPEC
          # ========================================================

          PUBSPEC="$(find _flutter_project \
            -type f \
            -name pubspec.yaml \
            | head -n 1)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERRO: pubspec.yaml não encontrado."
            echo ""
            echo "Arquivos encontrados:"
            find _flutter_project -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "VALIDANDO PROJETO FLUTTER"
          echo "========================================"

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -d "$PROJECT_DIR/lib"
          test -d "$PROJECT_DIR/test"
          test -d "$PROJECT_DIR/android"

          echo "Estrutura Flutter válida."

      # ============================================================
      # 5. VERSÕES
      # ============================================================
      - name: Show Tool Versions
        run: |
          echo "========================================"
          echo "VERSÕES"
          echo "========================================"

          flutter --version
          dart --version
          java -version

      # ============================================================
      # 6. AUDITAR EXPORT SERVICE
      # ============================================================
      - name: Audit Export Service
        shell: bash
        run: |
          set -e

          EXPORT_SERVICE="$PROJECT_DIR/lib/services/export_service.dart"

          echo "========================================"
          echo "EXPORT SERVICE"
          echo "========================================"

          if [ ! -f "$EXPORT_SERVICE" ]; then
            echo "ERRO: export_service.dart não encontrado."
            exit 1
          fi

          echo "Arquivo:"
          echo "$EXPORT_SERVICE"

          echo ""
          echo "Trecho relevante:"
          nl -ba "$EXPORT_SERVICE" | sed -n '535,555p'

          echo ""
          echo "========================================"
          echo "VERIFICANDO _desktopProcess!"
          echo "========================================"

          if grep -n '_desktopProcess!' "$EXPORT_SERVICE"; then
            echo ""
            echo "ERRO: _desktopProcess! ainda existe."
            exit 1
          fi

          echo "OK: nenhum _desktopProcess! encontrado."

      # ============================================================
      # 7. PUB GET
      # ============================================================
      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ============================================================
      # 8. FORMATAR DART
      # ============================================================
      # Não usar --set-exit-if-changed.
      # O workflow corrige automaticamente a formatação.
      # ============================================================
      - name: Dart Format
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart format lib test

      # ============================================================
      # 9. FLUTTER ANALYZE
      # ============================================================
      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      # ============================================================
      # 10. TESTES
      # ============================================================
      - name: Flutter Test
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      # ============================================================
      # 11. BUILD APK RELEASE
      # ============================================================
      - name: Build APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # ============================================================
      # 12. VERIFICAR APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          echo "========================================"
          echo "VERIFICANDO APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          ls -lh "$APK"

          echo ""
          echo "APK gerado com sucesso."

      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openreel-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ============================================================
      # 14. RESUMO
      # ============================================================
      - name: Build Summary
        shell: bash
        run: |
          echo "========================================"
          echo "OPENREEL BUILD"
          echo "========================================"

          echo ""
          echo "Projeto:"
          echo "$PROJECT_DIR"

          echo ""
          echo "APK:"
          echo "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          echo ""
          echo "STATUS: BUILD CONCLUÍDO COM SUCESSO"
