name: OpenReel - Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find and Extract OpenReel V10
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "OPENREEL V10"
          echo "========================================"

          echo "ZIPs encontrados no repositório:"
          find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print

          echo ""

          # Procura primeiro a versão final/fixed.
          ZIP="$(find . -type f -iname 'OpenReel-complete-project-v10-final-fixed.zip' \
            -not -path './.git/*' \
            | head -n 1)"

          # Fallback: qualquer ZIP V10.
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -iname 'OpenReel-complete-project-v10*.zip' \
              -not -path './.git/*' \
              | head -n 1)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP V10 encontrado."
            exit 1
          fi

          echo "ZIP utilizado:"
          echo "$ZIP"

          rm -rf _flutter_project
          mkdir -p _flutter_project

          unzip -q "$ZIP" -d _flutter_project

          echo ""
          echo "========================================"
          echo "LOCALIZANDO PUBSPEC"
          echo "========================================"

          PUBSPEC="$(find _flutter_project \
            -type f \
            -name pubspec.yaml \
            | head -n 1)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERRO: pubspec.yaml não encontrado."
            echo ""
            echo "Conteúdo extraído:"
            find _flutter_project -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "VALIDANDO PROJETO FLUTTER"
          echo "========================================"

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -d "$PROJECT_DIR/lib"
          test -d "$PROJECT_DIR/test"
          test -d "$PROJECT_DIR/android"

          echo "Estrutura Flutter válida."

          echo ""
          echo "========================================"
          echo "EXPORT_SERVICE REALMENTE USADO"
          echo "========================================"

          EXPORT_SERVICE="$PROJECT_DIR/lib/services/export_service.dart"

          if [ ! -f "$EXPORT_SERVICE" ]; then
            echo "ERRO: export_service.dart não encontrado."
            exit 1
          fi

          nl -ba "$EXPORT_SERVICE" | sed -n '535,555p'

          echo ""
          echo "========================================"
          echo "VERIFICANDO _desktopProcess!"
          echo "========================================"

          if grep -n '_desktopProcess!' "$EXPORT_SERVICE"; then
            echo "ERRO: _desktopProcess! ainda existe."
            exit 1
          fi

          echo "OK: nenhum _desktopProcess! encontrado."

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Dart Format Check
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Flutter Test
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="${PROJECT_DIR}/build/app/outputs/flutter-apk/app-release.apk"

          echo "========================================"
          echo "VERIFICANDO APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"

          echo "APK encontrado com sucesso."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openreel-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
